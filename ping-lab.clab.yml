name: ping-lab

topology:
  nodes:
    c1:
      kind: linux
      image: alpine:latest
      cmd: sleep infinity
      exec:
        - ip addr add 192.168.1.1/24 dev eth1
    c2:
      kind: linux
      image: alpine:latest
      cmd: sleep infinity
      exec:
        - ip addr add 192.168.1.2/24 dev eth1

  links:
    - endpoints: ["c1:eth1", "c2:eth1"]