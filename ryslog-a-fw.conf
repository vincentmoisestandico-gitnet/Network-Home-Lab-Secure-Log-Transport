global(workDirectory="/var/spool/rsyslog")
module(load="imfile")
template(name="fwd" type="string" string="<%PRI%>%TIMESTAMP:::date-rfc3339% %HOSTNAME% %syslogtag% %msg%\n")
input(type="imfile" File="/var/log/ulog/fw.log" Tag="a-fw-nft:" Severity="info" Facility="local4" PersistStateInterval="1")
# Buffer in memory/disk and retry forever if the tunnel or collector is down.
action(type="omfwd" target="198.51.100.10" port="514" protocol="tcp" template="fwd"
       queue.type="LinkedList" queue.filename="fwdq" queue.maxDiskSpace="100m"
       queue.saveOnShutdown="on" action.resumeRetryCount="-1" action.resumeInterval="5")
